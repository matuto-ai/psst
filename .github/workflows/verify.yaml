name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Check source syntax
        run: npm run check
      - name: Check operator shell syntax
        run: bash -n scripts/start-local-claude-lab.sh scripts/copy-image-node.sh scripts/start-local-broker.sh scripts/start-lan-broker.sh
      - name: Run focused unit tests
        run: npm test
