name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  verify:
    needs: [local-tests, container, rootless-podman, isolated-topology, browser-compose, browser-podman, cooperative-transport, current-transport, candidate-transport, native-presence]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          LOCAL_RESULT: ${{ needs.local-tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          PODMAN_RESULT: ${{ needs.rootless-podman.result }}
          BROWSER_COMPOSE_RESULT: ${{ needs.browser-compose.result }}
          BROWSER_PODMAN_RESULT: ${{ needs.browser-podman.result }}
          TRANSPORT_RESULT: ${{ needs.cooperative-transport.result }}
          CURRENT_RESULT: ${{ needs.current-transport.result }}
          CANDIDATE_RESULT: ${{ needs.candidate-transport.result }}
          NATIVE_PRESENCE_RESULT: ${{ needs.native-presence.result }}
          TOPOLOGY_RESULT: ${{ needs.isolated-topology.result }}
        run: test "$LOCAL_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$PODMAN_RESULT" = success && test "$BROWSER_COMPOSE_RESULT" = success && test "$BROWSER_PODMAN_RESULT" = success && test "$TRANSPORT_RESULT" = success && test "$CURRENT_RESULT" = success && test "$CANDIDATE_RESULT" = success && test "$NATIVE_PRESENCE_RESULT" = success && test "$TOPOLOGY_RESULT" = success
  isolated-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Build private disposable topology image without publication
        env:
          ENGINE: ${{ matrix.engine }}
        run: "$ENGINE build --target runtime -f Containerfile -t localhost/psst-topology:ci ."
      - name: Verify eight isolated reference adapters, TLS and recovery
        env:
          ENGINE: ${{ matrix.engine }}
        run: node scripts/container-topology.mjs "$ENGINE" localhost/psst-topology:ci
  native-presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/pi-psst-connector
          ref: b87e29851a21be4342f8f4585fc16b1003f6c763
          path: .native-presence/pi
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked connector fixture dependencies
        working-directory: .native-presence/pi
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install pinned official Pi into an isolated fixture
        run: npm install --prefix "$RUNNER_TEMP/pi-presence-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
      - name: Check native lifecycle fixture syntax
        run: |
          node --check integration/native-pi-presence.test.mjs
          node --check integration/native-pi-presence-observer.mjs
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('integration/native-pi-presence-pty.py').read_text())"
      - name: Verify actual native processes and negotiated wall-clock lease
        run: node --test integration/native-pi-presence.test.mjs
        env:
          PI_TEST_INSTALL: ${{ runner.temp }}/pi-presence-host
          PSST_NATIVE_PI_SOURCE: .native-presence/pi
          PSST_NATIVE_PRESENCE_EVIDENCE: ${{ runner.temp }}/native-presence.json
      - name: Keep sanitized lifecycle evidence, including partial progress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-pi-presence
          path: ${{ runner.temp }}/native-presence.json
          if-no-files-found: warn
          retention-days: 7
  local-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify pinned built-in SQLite runtime
        run: node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const d=new DatabaseSync(':memory:'); if(d.prepare('SELECT sqlite_version() AS v').get().v!=='3.53.3')process.exit(1); d.close()"
      - name: Check source syntax
        run: npm run check
      - name: Check local-lab shell syntax
        run: bash -n scripts/start-local-claude-lab.sh scripts/copy-image-node.sh scripts/start-local-broker.sh scripts/start-lan-broker.sh scripts/docker-publish-smoke.sh
      - name: Run local tests
        run: npm test
      - name: Check out the real immutable prior broker for upgrade recovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bd2dd445de4bf3105f20caafb471f280bf981b63
          path: .recovery-prior
          persist-credentials: false
      - name: Verify prior-entrypoint upgrade and independent SQLite restoration
        env:
          PSST_PREVIOUS_BROKER_SOURCE: .recovery-prior
        run: node --test integration/upgrade-recovery.test.mjs
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and test image (no registry push)
        run: docker build --target test -f Containerfile -t broker-test:ci .
      - name: Run HTTP integration as nonroot without external networking
        run: docker run --rm --network none --user node broker-test:ci node --test test/http.test.mjs
      - name: Build nonroot runtime image
        run: docker build --target runtime -f Containerfile -t broker-runtime:ci .
      - name: Verify runtime identity and SQLite availability
        run: docker run --rm --network none broker-runtime:ci node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; if(process.getuid()===0)process.exit(1); const d=new DatabaseSync(':memory:'); d.close()"
      - name: Smoke actual broker entrypoint as nonroot with disposable fixtures
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m broker-runtime:ci node scripts/container-smoke.mjs
      - name: Verify shipped no-credential connectivity bootstrap
        run: docker run --rm --network none --read-only --tmpfs /data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700 broker-runtime:ci node scripts/container-empty-smoke.mjs
      - name: Verify ordinary Docker published port and persistent volume
        run: bash scripts/docker-publish-smoke.sh broker-runtime:ci
      - name: Validate Compose packaging without starting another service
        run: docker compose -f compose.yaml config --quiet
  rootless-podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify preinstalled unprivileged rootless Podman
        run: |
          test "$(id -u)" -ne 0
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build digest-pinned runtime with rootless Podman
        run: podman build --target runtime -f Containerfile -t localhost/broker-podman:ci .
      - name: Smoke private bind mounts and restart under keep-id without network
        run: node scripts/podman-smoke.mjs localhost/broker-podman:ci
      - name: Verify isolated host runtime copied from the same local image
        run: |
          umask 077
          lab=$(mktemp -d "$RUNNER_TEMP/broker-node-copy.XXXXXXXX")
          trap 'rm -r -- "$lab"' EXIT
          bash scripts/copy-image-node.sh localhost/broker-podman:ci "$lab/node"
          "$lab/node" --test test/local-claude-lab.test.mjs
      - name: Run exact broker-only bootstrap without native clients or connector clone
        run: node scripts/local-broker-bootstrap-smoke.mjs localhost/broker-podman:ci
      - name: Verify host HTTPS from a separate rootless container without host-loopback exception
        run: node scripts/lan-broker-bootstrap-smoke.mjs localhost/broker-podman:ci
  # Browser dependencies are independent of the container runtime checks.
  # Keep the complete cold install, but do not serialize its network downloads
  # after the unrelated Docker/Podman suites on the workflow critical path.
  browser-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned browser QA tools in an isolated CI virtualenv
        run: |
          python3 -m venv "$RUNNER_TEMP/approval-browser"
          "$RUNNER_TEMP/approval-browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/approval-browser/bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          echo "$RUNNER_TEMP/approval-browser/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/approval-browser/bin/python" scripts/approval-browser-retry-test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify dynamic admin filters and themes in actual Chromium
        run: python scripts/admin-browser-smoke.py
        env:
          ADMIN_TEST_ARTIFACTS: ${{ runner.temp }}/admin-browser
      - name: Keep synthetic admin browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-browser
          path: ${{ runner.temp }}/admin-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Build nonroot runtime image for the independent browser job
        run: docker build --target runtime -f Containerfile -t broker-runtime:ci .
      - name: Check out immutable pre-approval broker for real schema3 migration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bd2dd445de4bf3105f20caafb471f280bf981b63
          path: .legacy-broker-source
          persist-credentials: false
      - name: Build prior runtime locally without registry publication
        run: docker build --target runtime -f .legacy-broker-source/Containerfile -t broker-legacy:ci .legacy-broker-source
      - name: Test ordinary Compose admin UI and persistent approval bootstrap
        run: bash scripts/approval-compose-smoke.sh broker-runtime:ci
        env:
          APPROVAL_TEST_LEGACY_IMAGE: broker-legacy:ci
          APPROVAL_TEST_ARTIFACTS: ${{ runner.temp }}/approval-ui-compose
      - name: Keep sanitized actual-browser UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approval-ui-compose
          path: ${{ runner.temp }}/approval-ui-compose/*.png
          if-no-files-found: warn
          retention-days: 7
  browser-podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned browser QA tools in an isolated CI virtualenv
        run: |
          python3 -m venv "$RUNNER_TEMP/approval-browser"
          "$RUNNER_TEMP/approval-browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/approval-browser/bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          echo "$RUNNER_TEMP/approval-browser/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/approval-browser/bin/python" scripts/approval-browser-retry-test.py
      - name: Verify preinstalled unprivileged rootless Podman
        run: |
          test "$(id -u)" -ne 0
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build digest-pinned runtime with rootless Podman
        run: podman build --target runtime -f Containerfile -t localhost/broker-podman:ci .
      - name: Check out immutable pre-approval broker for real schema3 migration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bd2dd445de4bf3105f20caafb471f280bf981b63
          path: .legacy-broker-source
          persist-credentials: false
      - name: Build prior runtime locally without registry publication
        run: podman build --target runtime -f .legacy-broker-source/Containerfile -t localhost/broker-legacy:ci .legacy-broker-source
      - name: Test rootless product admin UI and recreated data-volume approval
        run: node scripts/approval-container-smoke.mjs podman localhost/broker-podman:ci
        env:
          APPROVAL_TEST_LEGACY_IMAGE: localhost/broker-legacy:ci
          APPROVAL_TEST_ARTIFACTS: ${{ runner.temp }}/approval-ui-podman
      - name: Keep sanitized rootless actual-browser UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approval-ui-podman
          path: ${{ runner.temp }}/approval-ui-podman/*.png
          if-no-files-found: warn
          retention-days: 7
  cooperative-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/pi-broker-connector
          ref: f3d3bfc5cd17c10697d52e892f88c06a22ee2b16
          path: .matrix/pi
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/claude-code-broker-connector
          ref: e04de626a0d01dc6345eb750364e719dd59cc319
          path: .matrix/claude
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/antigravity-broker-connector
          ref: f3e0da54134bc03bd81f3c06c5ccc385d484b95e
          path: .matrix/antigravity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/opencode-broker-connector
          ref: 55b297525e6f931ab5c6ac377d1d8ccab8155bfb
          path: .matrix/opencode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install immutable OpenCode host tool schema dependency
        working-directory: .matrix/opencode
        run: npm ci --ignore-scripts
      - name: Verify matrix syntax
        run: node --check integration/connector-driver.mjs && node --check integration/connector-matrix.test.mjs
      - name: Pack all four connectors and test 16 routes twice with real TLS/admin approval
        env:
          PSST_MATRIX_SOURCES: '{"pi":".matrix/pi","claude-code":".matrix/claude","antigravity-cli":".matrix/antigravity","opencode":".matrix/opencode"}'
        run: node --test integration/connector-matrix.test.mjs
      # Synthetic host events + cooperative receive/ack are not authenticated model
      # acceptance. Official host/Compose/Podman gates remain in each repository;
      # OpenCode automatic admission and Antigravity sign-in remain separate gates.
  current-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/pi-psst-connector
          ref: b87e29851a21be4342f8f4585fc16b1003f6c763
          path: .current-matrix/pi
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/claude-psst-connector
          ref: c356ba09b8e11d516dbdf7a8e4f04ea6ed5841ae
          path: .current-matrix/claude
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/antigravity-psst-connector
          ref: 9e6eb0315b28b27c73406fbbc1bfe5dac477fe9c
          path: .current-matrix/antigravity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/opencode-psst-connector
          ref: 3eb99d967c34f94b4954bb5efe13f2a07e21986b
          path: .current-matrix/opencode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned Pi renderer dependency without peer hosts or scripts
        working-directory: .current-matrix/pi
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install pinned OpenCode runtime schema dependency without host or scripts
        working-directory: .current-matrix/opencode
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Check current matrix sources
        run: for source in integration/current-*.mjs; do node --check "$source"; done
      - name: Verify current packed connectors with explicit synthetic native boundaries
        env:
          PSST_CURRENT_MATRIX_SOURCES: '{"pi":".current-matrix/pi","claude-code":".current-matrix/claude","antigravity-cli":".current-matrix/antigravity","opencode":".current-matrix/opencode"}'
        run: node --test integration/current-connector-matrix.test.mjs
      # Real packages, broker/TLS, inboxes, monitor/waiter and operation guards.
      # Synthetic host input/context, native receipts and model read/ACK actions.
      # The legacy cooperative cohort remains an independent compatibility lane.

  # Explicit PR dependencies: Pi28, Claude28, Antigravity24, OpenCode20.
  # This transport-only lane does not replace any native approval or source-PR gate.
  candidate-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/pi-psst-connector
          ref: 95170f56e025b17bff49b6d4d3bbb9897b9256b3
          path: .candidate-matrix/pi
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/claude-psst-connector
          ref: 6a8d2f215913f8250a114a9802411eea2595a0e0
          path: .candidate-matrix/claude
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/antigravity-psst-connector
          ref: 3bf54ee24703bb38ac1764184e17d50615c67c23
          path: .candidate-matrix/antigravity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/opencode-psst-connector
          ref: c14bc10db807e3ba0b3d6594d5b1c3b8c118f31f
          path: .candidate-matrix/opencode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned Pi renderer dependency without peer hosts or scripts
        working-directory: .candidate-matrix/pi
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install pinned OpenCode runtime schema dependency without host or scripts
        working-directory: .candidate-matrix/opencode
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Check current matrix sources
        run: for source in integration/current-*.mjs; do node --check "$source"; done
      - name: Verify explicitly unmerged candidate packages with synthetic native boundaries
        env:
          PSST_CURRENT_MATRIX_SOURCES: '{"pi":".candidate-matrix/pi","claude-code":".candidate-matrix/claude","antigravity-cli":".candidate-matrix/antigravity","opencode":".candidate-matrix/opencode"}'
        run: node --test integration/current-connector-matrix.test.mjs
      # Real packages, broker/TLS, inboxes, monitor/waiter and operation guards.
      # Synthetic host input/context, native receipts and model read/ACK actions.
      # The legacy cooperative cohort remains an independent compatibility lane.
